name: tax-news-brief

on:
  schedule:
    - cron: '25 3 * * *'
    - cron: '25 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tax-news-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m brief.run

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "tax-brief-bot"
          git config user.email "tax-brief-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "state update $(date -u +%F_%H%M)" && git push)
