lookback_hours_fallback: 14

noise_terms:
  - "horoscope"
  - "share price target"
  - "buy or sell"
  - "stock recommendation"
  - "ipl "
  - "bollywood"
  - "web series"
  - "ott release"

buckets:

  - name: "Tata Group"
    priority: 1
    queries:
      - 'Tata'

  - name: "Pillar Two / GloBE"
    priority: 1
    queries:
      - '"Pillar 2" OR "Pillar Two"'
      - '"global minimum tax"'
    rss:
      - https://www.oecd.org/tax/beps/beps-actions/action-1/rss.xml

  - name: "CbCR, Public CbCR & Master File"
    priority: 1
    queries:
      - '"Public CbCR" OR "CbCR"'
      - '"country-by-country reporting" OR "Master File" transfer pricing'

  - name: "Income Tax"
    priority: 1
    queries:
      - '"income tax" OR tax India'
      - 'CBDT circular OR notification OR ruling'

  - name: "GST"
    priority: 1
    queries:
      - 'GST'

  - name: "India — Top News"
    priority: 2
    rss:
      - https://news.google.com/rss/headlines/section/geo/India?hl=en-IN&gl=IN&ceid=IN:en

  - name: "Mumbai News"
    priority: 2
    queries:
      - 'Mumbai'

  - name: "Politics — India & World"
    priority: 2
    queries:
      - 'India politics OR parliament OR "Lok Sabha" OR "Rajya Sabha"'
      - '"world politics" OR election OR geopolitics'

  - name: "Macro & Micro Economics — India & World"
    priority: 2
    queries:
      - '"Indian economy" OR "GDP" India OR RBI OR inflation'
      - '"global economy" OR "world economy" OR "macroeconomics"'

  - name: "Indian Stock Market"
    priority: 2
    queries:
      - 'Sensex OR Nifty OR "Indian stock market" OR BSE OR NSE'
      - '"Indian stocks" OR sector OR "market movement"'

  - name: "AI News"
    priority: 2
    queries:
      - '"artificial intelligence" OR "AI model" OR "AI development"'
      - 'ChatGPT OR "Claude AI" OR Gemini OR DeepSeek OR OpenAI OR Anthropic'
